{% extends "base.html" %}
{% block title %}Create account · Pocketjar{% endblock %}
{% block body %}
<main class="auth">
  <div class="auth-art"><div class="coin c1">₹</div><div class="coin c2">₹</div><div class="coin c3">₹</div><div class="jar"></div></div>
  <form method="post" class="auth-card">
    <h1>Start your jar</h1>
    <p>Your expenses stay private to your account.</p>
    <label>Name<input name="name" required maxlength="80" autocomplete="name"></label>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
    <button class="btn">Create account</button>
    <p class="alt">Have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </form>
</main>
{% endblock %}
